[package]
name = "ajentir-mongodb"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "MongoDB implementation of a Rig vector store."
repository = "https://github.com/KigHeart/ajentir"

[lints]
workspace = true

[dependencies]
futures = { workspace = true }
mongodb = { workspace = true }
rig-core = { package = "ajentir-core", path = "../rig-core", version = "0.42.0", default-features = false  }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rig-reqwest = { package = "ajentir-reqwest", path = "../rig-reqwest", version = "0.42.0"  }
anyhow = { workspace = true }
httpmock = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-test = { workspace = true }

[[example]]
name = "vector_search_mongodb"
required-features = ["rig-core/derive"]
