[package]
name = "ajentir-neo4j"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Neo4j implementation of a Rig vector store."
repository = "https://github.com/KigHeart/ajentir"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = { workspace = true }
neo4rs = { workspace = true }
rig-core = { package = "ajentir-core", path = "../rig-core", version = "0.42.0", default-features = false  }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rig-reqwest = { package = "ajentir-reqwest", path = "../rig-reqwest", version = "0.42.0"  }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
textwrap = { workspace = true }
term_size = { workspace = true }
testcontainers = { workspace = true }
tracing-subscriber = { workspace = true }
httpmock = { workspace = true }

[[example]]
name = "vector_search_simple"
required-features = ["rig-core/derive"]
