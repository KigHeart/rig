[package]
name = "ajentir-memory"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Conversation memory policies (sliding window, token budget, ...) for the Rig agent framework."
repository = "https://github.com/KigHeart/ajentir"

[lints]
workspace = true

[dependencies]
rig-core = { package = "ajentir-core", path = "../rig-core", version = "0.42.0", default-features = false  }
tracing = { workspace = true }

[dev-dependencies]
rig-reqwest = { package = "ajentir-reqwest", path = "../rig-reqwest", version = "0.42.0"  }
anyhow = { workspace = true }
rig-agent.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[example]]
name = "agent_with_memory_policies"
required-features = []
