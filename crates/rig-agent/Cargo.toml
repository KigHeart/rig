[package]
name = "ajentir-agent"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "Rig's classic agent runtime."
repository = "https://github.com/KigHeart/ajentir"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_agent"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
rig-core = { package = "ajentir-core", path = "../rig-core", version = "0.42.0", default-features = false  }
rig-derive = { package = "ajentir-derive", path = "../rig-derive", version = "0.42.0", optional = true  }
rig-run = { package = "ajentir-run", path = "../rig-run", version = "0.42.0"  }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }

[dev-dependencies]
rig-reqwest = { package = "ajentir-reqwest", path = "../rig-reqwest", version = "0.42.0"  }
anyhow = { workspace = true }
# `cargo test -p rig-agent` needs rig-core's mock models even when the
# `test-utils` feature is not requested explicitly.
rig-core = { package = "ajentir-core", path = "../rig-core", features = ["test-utils"]  }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["derive"]
audio = ["rig-core/audio"]
image = ["rig-core/image"]
derive = ["dep:rig-derive", "rig-core/derive"]
test-utils = ["rig-core/test-utils", "dep:tokio"]
